name: settle
# After the close: saves the day's bars, simulates every tester's exits, rewrites reports/summary.md.
on:
  schedule:
    - cron: "20 20,21 * * 1-5"              # 16:20 ET in summer time and again in winter time; the second run is a no-op if the first finished
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tester
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: After the close?
        id: gate
        run: |
          H=$(TZ=America/New_York date +%H%M); D=$(TZ=America/New_York date +%u)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$D" -le 5 ] && [ "$H" -ge 1610 ] && [ "$H" -le 1800 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "not after the close ($D $H), skipping"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Settle the day
        if: steps.gate.outputs.run == 'true'
        run: python -m tester.collect settle
      - name: Commit data
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "tester-bot"
          git config user.email "tester-bot@users.noreply.github.com"
          git add -A data reports
          if ! git diff --cached --quiet; then
            git commit -m "settle $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4; do git pull --rebase -q && git push -q && break || sleep 6; done
          fi
