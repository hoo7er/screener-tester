name: seed
# Run this ONCE by hand (Actions tab -> seed -> Run workflow). It downloads ~58 days of 15m bars and
# replays them through every tester so you have a baseline immediately.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tester
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m tester.collect seed
      - name: Commit data
        run: |
          git config user.name "tester-bot"
          git config user.email "tester-bot@users.noreply.github.com"
          git add -A data reports
          if ! git diff --cached --quiet; then
            git commit -m "seed"
            for i in 1 2 3 4; do git pull --rebase -q && git push -q && break || sleep 6; done
          fi
